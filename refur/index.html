<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#24161c">
<title>REFUR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%2324161c' width='16' height='16'/%3E%3Crect fill='%23e0b15a' x='3' y='3' width='10' height='10'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #24161c;
    color: #f4e6c8;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    font-family: "Courier New", ui-monospace, monospace;
  }
  #app { position: fixed; inset: 0; }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  #insets {
    position: fixed;
    left: env(safe-area-inset-left, 0px);
    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    pointer-events: none;
    visibility: hidden;
  }
  #boot, #err, #turn {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  #boot { z-index: 2; background: #3a2a48; letter-spacing: 0.08em; }
  #err {
    z-index: 6;
    display: none;
    background: #3a1820;
    color: #f4e6c8;
    white-space: pre-wrap;
  }
  #turn {
    z-index: 5;
    display: none;
    flex-direction: column;
    gap: 12px;
    background: #2a1c38;
  }
  #turn strong { font-size: 22px; letter-spacing: 0.12em; }
  #turn span { opacity: 0.8; max-width: 280px; }
  @media (orientation: portrait) {
    #turn { display: flex; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="insets"></div>
</div>
<div id="boot">The husk is waking…</div>
<div id="turn">
  <strong>TURN THE HUSK SIDEWAYS</strong>
  <span>REFUR is played in landscape.</span>
</div>
<div id="err"></div>
<script src="poker.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
