const SANS = '"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function rgba(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }
const COL = {
  teal: [92, 240, 214], amber: [255, 178, 82], pink: [255, 112, 172], grey: [132, 140, 130],
  white: [236, 246, 226], leaf: [132, 206, 96], parch: [232, 222, 196], moss: [150, 214, 120],
  warm: [255, 214, 150], silt: [214, 200, 156], tea: [120, 70, 34],
};
function fmt(n) {
  if (!isFinite(n)) return '0';
  if (n < 10) return (Math.floor(n * 10) / 10).toString();
  if (n < 1000) return Math.floor(n).toString();
  const u = ['k', 'M', 'B', 'T', 'Q']; let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n).toString()) + u[i];
}
function fmtDur(sec) {
  if (sec < 3600) { const m = Math.max(1, Math.round(sec / 60)); return m + (m === 1 ? ' minute' : ' minutes'); }
  const h = Math.round(sec / 360) / 10; return h + (h === 1 ? ' hour' : ' hours');
}

  H = Math.round(clamp(W * wh / ww, 800, 1000)); EX = H - 800;
  scale = Math.min(ww / W, wh / H); dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  REACH = 125 + EX * 0.16; AIR_REACH = REACH + 36;
  layout(); buildBG(); buildFG();
  if (!ex.air && L.slots[ex.perch]) { ex.x = L.slots[ex.perch].px; ex.y = L.slots[ex.perch].py; }
  if (gn.x > W - 60) gn.x = W - 80;
}
window.addEventListener('resize', resize);

function draw() {
  uiRects = [];
  const s = scale * dpr;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (shakeT > 0) ctx.translate(Math.sin(T * 80) * shakeT * 14, Math.cos(T * 70) * shakeT * 10);
  ctx.drawImage(bg, 0, 0, W, H);
  drawShafts();
  drawThreads();
  drawAnts();
  drawMushGlow();
  drawStreamFX();
  drawSeedlings();
  for (const k of knots) drawKnot(k);
  drawGnawer();
  drawExplorer();
  drawMotes();
  drawParts();
  drawLeaves();
  drawDrops();
  ctx.drawImage(fg, 0, 0, W, H);
  drawFloats();
  ctx.setTransform(s, 0, 0, s, 0, 0);
  if (mode === 'play' || mode === 'flood') {
    drawPrompt();
    drawHUD();
    drawBar();
    drawCaption();
    drawPanel();
  }
  if (mode === 'title') drawTitle();
  if (mode === 'intro') drawIntro();
  drawFlood();
}

let last = performance.now(), welcome = null;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}

function init() {
  const had = load();
  resize();
  const s = L.slots[L.startSlot]; ex.x = s.px; ex.y = s.py; ex.perch = ex.target = L.startSlot;
  if (!S.flags.firstLoosen) knots.push(makeKnot(1, { first: true, instant: true }));
  else fillKnotsNow();
  if (had && S.introDone) {
    const away = (Date.now() - (S.saved || Date.now())) / 1000;
    if (away > 60) {
      const lvl = S.run.strains.sleeps;
      if (lvl > 0 && S.run.threads > 0) {
        const earned = passive() * Math.min(away, 8 * 3600) * Math.min(0.5, 0.1 * lvl);
        S.run.give += earned; S.run.canopy += earned;
        welcome = 'You were gone ' + fmtDur(away) + '. The sleeping strain kept the threads working: +' + fmt(earned) + ' give.';
      } else if (S.run.threads > 0) {
        welcome = 'You were gone ' + fmtDur(away) + '. The threads went still while you were away. The ants know a strain that sleeps.';
      } else welcome = 'You were gone ' + fmtDur(away) + '. The knots kept breathing.';
    }
  }
  if (QS.get('skip') === '1') { S.introDone = true; mode = 'play'; if (welcome) { caption(welcome, 7); welcome = null; } }
  requestAnimationFrame(t => { last = t; frame(t); });
}

if (DEBUG) {
  window.LOOSEN = {
    get S() { return S; }, get knots() { return knots; }, get ex() { return ex; }, get motes() { return motes; },
    get mode() { return mode; }, get panel() { return panel; }, get leaves() { return leaves; }, get captionText() { return capCur ? capCur.text : null; },
    get T() { return T; }, get H() { return H; }, get L() { return L; },
    setCanopy(v) { S.run.canopy = v; }, addGive(v) { S.run.give += v; }, addLeaves(n) { S.run.leaves += n; S.flags.firstLeafCaught = true; },
    giveSherd(type, trait) { if (!S.sherds.some(s => s.type === type)) S.sherds.push({ type, trait: trait || 'thumb' }); },
    forceLeaf() { spawnLeaf(); return leaves[leaves.length - 1]; },
    openPanel(p) { panel = p; panelT = 1; }, clearCaptions() { captions = []; capCur = null; },
    toClient(x, y) { const r = canvas.getBoundingClientRect(); return { x: r.left + x / W * r.width, y: r.top + y / H * r.height }; },
    msToPeak(k) { return (1 - peakFrac(k)) * PERIOD * 1000; },
    knotInfo() { const [bx, by] = exBody(); return liveKnots().map(k => ({ slot: k.slot, x: k.x, y: k.y, r: k.r, grip: k.grip, maxGrip: k.maxGrip, grow: k.grow, msToPeak: (1 - peakFrac(k)) * PERIOD * 1000, dist: Math.hypot(k.x - bx, k.y - by), reach: REACH })); },
    btn(id) { return btnRect(id); }, rects() { return uiRects.map(r => ({ id: r.id, x: r.x, y: r.y, w: r.w, h: r.h })); },
    fastForward(sec) { const n = Math.ceil(sec * 30); for (let i = 0; i < n; i++) update(1 / 30); },
    get audio() { return AU.ctx ? AU.ctx.state : 'none'; },
    get audioInfo() { return { state: AU.ctx ? AU.ctx.state : 'none', buffers: Object.keys(AU.buf || {}).sort(), loops: Object.keys(AU.loops || {}).sort(), pad: !!AU.pad }; },
    get images() { return Object.keys(IMG).sort(); }, hasAssets: HAS_ASSETS,
    freezeSaves() { savesFrozen = true; },
    save, load, threadCost, passive, stage, rotLife,
  };
}
init();

})();

</script>
